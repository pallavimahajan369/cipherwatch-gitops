apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-frontend
  namespace: cipherwatch
  labels:
    app: aura-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: aura-frontend

  template:
    metadata:
      labels:
        app: aura-frontend

    spec:
      containers:
        - name: frontend
          image: dark0creator/cipherwatch-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 300m
              memory: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-backend
  namespace: cipherwatch
  labels:
    app: aura-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: aura-backend

  template:
    metadata:
      labels:
        app: aura-backend

    spec:
      containers:
        - name: backend
          image: dark0creator/cipherwatch-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: backend-secret

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: 500m
              memory: 1Gi

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-db
  namespace: cipherwatch
  labels:
    app: aura-db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: aura-db

  template:
    metadata:
      labels:
        app: aura-db

    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_NAME

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 1Gi
