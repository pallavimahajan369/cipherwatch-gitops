apiVersion: apps/v1
kind: Deployment

metadata:
  name: cipherwatch
  namespace: apps

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cipherwatch

  template:
    metadata:
      labels:
        app: cipherwatch

    spec:
      containers:
        - name: cipherwatch

          image: docker.io/dark0creator/cipherwatch:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
