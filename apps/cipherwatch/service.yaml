apiVersion: v1
kind: Service
metadata:
  name: aura-frontend-service
  namespace: cipherwatch
  labels:
    app: aura-frontend

spec:
  selector:
    app: aura-frontend

  ports:
    - name: http
      port: 80
      targetPort: 80

  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: aura-backend-service
  namespace: cipherwatch
  labels:
    app: aura-backend

spec:
  selector:
    app: aura-backend

  ports:
    - name: http
      port: 3000
      targetPort: 3000

  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: cipherwatch
  labels:
    app: aura-db

spec:
  selector:
    app: aura-db

  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

  type: ClusterIP
